name: MORSE Stage 11 source asset recovery

on:
  push:
    branches:
      - research/morse-stage11-asset-recovery-20260730
    paths:
      - ".github/workflows/morse_stage11_asset_recovery.yml"
      - "research/morse-stage11/**"

permissions:
  contents: read

concurrency:
  group: morse-stage11-source-asset-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install exact dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.34.2

      - name: Recover exact official assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated/morse-stage11-assets
          mkdir -p generated/morse-stage11-assets
          python research/morse-stage11/recover_assets.py generated/morse-stage11-assets
          cat generated/morse-stage11-assets/SUMMARY.txt

      - name: Package immutable result
        shell: bash
        run: |
          set -euo pipefail
          tar -C generated -czf morse-stage11-assets.tar.gz morse-stage11-assets
          sha256sum morse-stage11-assets.tar.gz > morse-stage11-assets.tar.gz.sha256

      - name: Upload one-day artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: morse-stage11-source-assets-${{ github.run_id }}
          path: |
            morse-stage11-assets.tar.gz
            morse-stage11-assets.tar.gz.sha256
            generated/morse-stage11-assets/ROOT_RECEIPT.json
            generated/morse-stage11-assets/SUMMARY.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce recovery receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('generated/morse-stage11-assets/ROOT_RECEIPT.json').read_text())
          assert r['success_count']==8 and r['failure_count']==0, r
          assert r['case_selection_allowed'] is False
          assert r['corpus_patch_allowed'] is False
          assert r['semantic_rules_changed'] is False
          assert r['automatic_merge'] is False
          assert r['merge_performed'] is False
          print('SOURCE_ASSET_RECOVERY=PASS')
          PY
