name: MORSE Stage 15 full pySHACL engine verification

on:
  push:
    branches:
      - research/morse-stage15-pyshacl-20260730
    paths:
      - ".github/workflows/morse_stage15_pyshacl.yml"
      - "research/morse-stage15/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/morse_stage15_pyshacl.yml"
      - "research/morse-stage15/**"

permissions:
  contents: read

concurrency:
  group: morse-stage15-pyshacl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install pinned independent SHACL processor
        run: |
          python -m pip install --disable-pip-version-check --no-input pyshacl==0.40.1
          python - <<'PY'
          import pyshacl, rdflib
          print("PYSHACL_VERSION=" + pyshacl.__version__)
          print("RDFLIB_VERSION=" + rdflib.__version__)
          PY

      - name: Restore exact formal challenge from frozen generator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage15
          mkdir -p stage15/input stage15/scripts stage15/output
          cp research/morse-stage15/input/* stage15/input/
          cp research/morse-stage15/src/*.py stage15/scripts/
          python -m py_compile stage15/scripts/*.py
          PYTHONPATH=stage15/scripts python stage15/scripts/build_extended_challenge.py \
            --profile stage15/input/B0_PAIR_EXTENDED_PROFILE_0_2.json \
            --out stage15/input/EXTENDED_POLICY_PAIRS_250.jsonl
          echo "5c8ad60bcfed43f447e4223c47405a6127ca4a33b31b95bcf7214f1b72ace18c  stage15/input/EXTENDED_POLICY_PAIRS_250.jsonl" | sha256sum -c -

      - name: Run full pySHACL validation
        shell: bash
        run: |
          set -euo pipefail
          cd stage15
          PYTHONPATH=scripts python scripts/run_pyshacl_external.py | tee pyshacl_console.log
          test -f output/MORSE_STAGE15_PYSHACL_RECEIPT_0_1.json
          grep -q '^STATUS=PASS$' output/SUMMARY.txt

      - name: Package immutable result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d stage15/output
          cp stage15/pyshacl_console.log stage15/output/PYSHACL_CONSOLE.log || true
          tar -C stage15 -czf morse-stage15-pyshacl-result.tar.gz output input scripts
          sha256sum morse-stage15-pyshacl-result.tar.gz > morse-stage15-pyshacl-result.tar.gz.sha256

      - name: Upload one-day research artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: morse-stage15-pyshacl-${{ github.run_id }}
          path: |
            morse-stage15-pyshacl-result.tar.gz
            morse-stage15-pyshacl-result.tar.gz.sha256
            stage15/output/MORSE_STAGE15_PYSHACL_RECEIPT_0_1.json
            stage15/output/SUMMARY.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce scientific guards
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat stage15/output/SUMMARY.txt
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage15/output/MORSE_STAGE15_PYSHACL_RECEIPT_0_1.json').read_text())
          assert r['status']=='PASS', r
          assert r['total_pair_count']==250, r
          assert r['total_mismatch_count']==0, r
          assert r['guards']['human_gold'] is False
          assert r['guards']['natural_errors_measured'] is False
          assert r['guards']['morse_effectiveness_measured'] is False
          assert r['guards']['production_ready'] is False
          assert r['guards']['case_selection_changed'] is False
          assert r['guards']['semantic_rules_changed'] is False
          print('FULL_PYSHACL_VERIFICATION=PASS')
          PY
