services:
  - type: web
    name: vocab-duel
    env: python
    plan: free
    rootDir: vocab_duel_game
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_DIR
        value: /opt/render/project/src/vocab_duel_game/data
